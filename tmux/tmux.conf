# tmux 配置 —— 起步版，不求全，用顺手了再加

# 前缀键从 Ctrl-b 改成 Ctrl-a：左手小指够得到，Ctrl-b 要跨半个键盘
unbind C-b
set -g prefix C-a
bind C-a send-prefix   # 连按两下把 Ctrl-a 传给内层程序（vim 里会用到）

# 用 | 和 - 分屏，比默认的 % 和 " 直观得多
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# 新面板继承当前目录（默认会回到家目录，很烦）
bind c new-window -c "#{pane_current_path}"

# 用 hjkl 在面板间跳（不用带前缀的方向键）
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g mouse on            # 鼠标可点选面板、滚动历史
set -g base-index 1        # 窗口从 1 开始编号（0 在键盘最右边，反人类）
setw -g pane-base-index 1
set -g history-limit 50000 # 回滚缓冲，默认 2000 太少
set -sg escape-time 10     # 默认 500ms 会让 vim 里按 Esc 有延迟

# 改完配置后按 prefix + r 直接重载，不用退出 tmux
bind r source-file ~/.tmux.conf \; display "配置已重载"
